---
- name: Exercise the Bookmark-Page collection
  hosts: localhost
  gather_facts: false
  vars:
    v1_url: '{{ v1_fixture_url }}'
  module_defaults:
    leeo86.bookmarks.entry:
      api_url: '{{ api_url }}'
      api_token: '{{ api_token }}'
      validate_certs: '{{ validate_certs }}'
    leeo86.bookmarks.entries_sync:
      api_url: '{{ api_url }}'
      api_token: '{{ api_token }}'
      validate_certs: '{{ validate_certs }}'
    leeo86.bookmarks.entry_info:
      api_url: '{{ api_url }}'
      api_token: '{{ api_token }}'
      validate_certs: '{{ validate_certs }}'
    leeo86.bookmarks.tag_namespace:
      api_url: '{{ api_url }}'
      api_token: '{{ api_token }}'
      validate_certs: '{{ validate_certs }}'
    leeo86.bookmarks.field_definition:
      api_url: '{{ api_url }}'
      api_token: '{{ api_token }}'
      validate_certs: '{{ validate_certs }}'
    leeo86.bookmarks.filter:
      api_url: '{{ api_url }}'
      api_token: '{{ api_token }}'
      validate_certs: '{{ validate_certs }}'
    leeo86.bookmarks.action_template:
      api_url: '{{ api_url }}'
      api_token: '{{ api_token }}'
      validate_certs: '{{ validate_certs }}'
  tasks:
    - name: Set independent V2 branding before importing V1
      leeo86.bookmarks.site_branding:
        api_url: '{{ api_url }}'
        api_token: '{{ api_token }}'
        validate_certs: '{{ validate_certs }}'
        site_title: V2 title
        site_claim: V2 claim

    - name: Ensure the type namespace
      leeo86.bookmarks.tag_namespace:
        name: type
        label: Type
        colour: '#0f766e'
      register: namespace_created

    - name: Leave the type namespace unchanged
      leeo86.bookmarks.tag_namespace:
        name: type
        label: Type
        colour: '#0f766e'
      register: namespace_same

    - name: Ensure a note field
      leeo86.bookmarks.field_definition:
        key: note
        label: Note
        type: text
        min_role: viewer
        searchable: true
        show_as_column: true
      register: note_created

    - name: Rename the note field
      leeo86.bookmarks.field_definition:
        key: note
        label: Notes
        type: text
        min_role: viewer
        searchable: true
        show_as_column: true
      register: note_renamed

    - name: Leave the renamed note field unchanged
      leeo86.bookmarks.field_definition:
        key: note
        label: Notes
        type: text
        min_role: viewer
        searchable: true
        show_as_column: true
      register: note_same

    - name: Ensure a secret field
      leeo86.bookmarks.field_definition:
        key: password
        label: Password
        type: secret
        min_role: viewer
        searchable: true
        show_as_column: false

    - name: Ensure a public audio tab
      leeo86.bookmarks.filter:
        name: Audio
        query: type:audio
        is_public: true
        icon: audio-lines
      register: filter_created

    - name: Leave the audio tab unchanged
      leeo86.bookmarks.filter:
        name: Audio
        query: type:audio
        is_public: true
        icon: audio-lines
      register: filter_same

    - name: Ensure a health action template
      leeo86.bookmarks.action_template:
        name: Health
        query: type:audio
        method: GET
        url_template: http://10.0.0.8/health
        confirm: false
      register: template_created

    - name: Leave the health template unchanged
      leeo86.bookmarks.action_template:
        name: Health
        query: type:audio
        method: GET
        url_template: http://10.0.0.8/health
        confirm: false
      register: template_same

    - name: Ensure a desk entry
      leeo86.bookmarks.entry:
        scope: manual
        external_key: desk-1
        name: Desk
        host: 10.0.0.8
        icon: camera
        tags:
          - type:audio
        links:
          - label: Admin
            url_template: http://10.0.0.8/
            primary: true
        fields:
          - key: note
            value: Lawo
        checks:
          - name: Ping
            kind: icmp
      register: desk_created

    - name: Leave the desk entry unchanged
      leeo86.bookmarks.entry:
        scope: manual
        external_key: desk-1
        name: Desk
        host: 10.0.0.8
        icon: camera
        tags:
          - type:audio
        links:
          - label: Admin
            url_template: http://10.0.0.8/
            primary: true
        fields:
          - key: note
            value: Lawo
        checks:
          - name: Ping
            kind: icmp
      register: desk_same

    - name: Preview an entry without writing it
      leeo86.bookmarks.entry:
        scope: manual
        external_key: preview
        name: Preview
      check_mode: true
      register: preview

    - name: Store a secret on an entry
      leeo86.bookmarks.entry:
        scope: manual
        external_key: secret-1
        name: Secret
        fields:
          - key: password
            value: secret-pass

    - name: Check mode ignores a masked secret change
      leeo86.bookmarks.entry:
        scope: manual
        external_key: secret-1
        name: Secret
        fields:
          - key: password
            value: next-secret
      check_mode: true
      register: secret_preview

    - name: Create and remove a temporary entry
      leeo86.bookmarks.entry:
        scope: manual
        external_key: temp
        name: Temp
      register: temp_created

    - name: Remove the temporary entry
      leeo86.bookmarks.entry:
        scope: manual
        external_key: temp
        state: absent
      register: temp_removed

    - name: Leave the missing temporary entry absent
      leeo86.bookmarks.entry:
        scope: manual
        external_key: temp
        state: absent
      register: temp_absent

    - name: Sync a batch of entries
      leeo86.bookmarks.entries_sync:
        scope: batch
        purge: true
        entries:
          - external_key: one
            name: One
            host: 10.2.0.1
            tags:
              - type:audio
          - external_key: two
            name: Two
            host: 10.2.0.2
      register: batch_first

    - name: Sync the same batch again
      leeo86.bookmarks.entries_sync:
        scope: batch
        purge: true
        entries:
          - external_key: one
            name: One
            host: 10.2.0.1
            tags:
              - type:audio
          - external_key: two
            name: Two
            host: 10.2.0.2
      register: batch_second

    - name: Query the batch
      leeo86.bookmarks.entry_info:
        query: One
      register: batch_info

    - name: Catalog and entry modules are idempotent
      ansible.builtin.assert:
        that:
          - namespace_created is changed
          - namespace_same is not changed
          - note_created is changed
          - note_renamed is changed
          - note_same is not changed
          - filter_created is changed
          - filter_same is not changed
          - template_created is changed
          - template_same is not changed
          - desk_created is changed
          - desk_same is not changed
          - preview is changed
          - secret_preview is not changed
          - temp_created is changed
          - temp_removed is changed
          - temp_absent is not changed
          - batch_first is changed
          - batch_first.created | length == 2
          - batch_second is not changed
          - batch_info.entries | selectattr('externalKey', 'equalto', 'one') | list | length == 1
          - batch_info.entries | selectattr('externalKey', 'equalto', 'preview') | list | length == 0

    - name: Sync the studio inventory
      ansible.builtin.include_role:
        name: leeo86.bookmarks.inventory_sync
      vars:
        bookmark_inventory_group: studio
        bookmark_scope: inventory
        bookmark_group_namespaces:
          audio: type

    - name: Remember the first inventory result
      ansible.builtin.set_fact:
        inventory_first_changed: '{{ bookmark_sync.changed }}'

    - name: Sync the studio inventory again
      ansible.builtin.include_role:
        name: leeo86.bookmarks.inventory_sync
      vars:
        bookmark_inventory_group: studio
        bookmark_scope: inventory
        bookmark_group_namespaces:
          audio: type

    - name: Read inventory entries
      leeo86.bookmarks.entry_info:
        query: Mixer
      register: inventory_info

    - name: Inventory sync is idempotent and maps groups to tags
      ansible.builtin.assert:
        that:
          - inventory_first_changed | bool
          - bookmark_sync is not changed
          - inventory_mixer.iconRef == 'lucide:camera'
          - inventory_mixer.host == '10.0.0.8'
          - "'group:studio' in inventory_tags"
          - "'type:audio' in inventory_tags"
          - (inventory_mixer.fields | selectattr('key', 'equalto', 'note') | map(attribute='value') | first) == 'desk'
      vars:
        inventory_rows: "{{ inventory_info.entries | selectattr('scope', 'equalto', 'inventory') | list }}"
        inventory_mixer: "{{ inventory_rows | selectattr('externalKey', 'equalto', 'mixer') | first }}"
        inventory_tags: "{{ inventory_mixer.tags | map(attribute='label') | list }}"

    - name: Preview a purge without deleting inventory entries
      leeo86.bookmarks.entries_sync:
        scope: inventory
        purge: true
        entries: []
      check_mode: true
      register: inventory_dry

    - name: Read inventory entries after the dry run
      leeo86.bookmarks.entry_info:
        query: Camera
      register: inventory_after_dry

    - name: The dry run reports deletions and keeps the entries
      ansible.builtin.assert:
        that:
          - inventory_dry is changed
          - inventory_dry.deleted | length == 2
          - inventory_after_dry.entries | selectattr('scope', 'equalto', 'inventory') | list | length == 1

    - name: Import the V1 fixture
      ansible.builtin.include_role:
        name: leeo86.bookmarks.v1_import
      vars:
        v1_import_secret_fields:
          - user2
        v1_scope: v1-import

    - name: Remember the first import result
      ansible.builtin.set_fact:
        v1_first_changed: '{{ v1_sync.changed }}'

    - name: Import the V1 fixture again
      ansible.builtin.include_role:
        name: leeo86.bookmarks.v1_import
      vars:
        v1_import_secret_fields:
          - user2
        v1_scope: v1-import

    - name: Read the imported mixer
      leeo86.bookmarks.entry_info:
        query: Mixer
      register: v1_mixer_info

    - name: Read the imported camera
      leeo86.bookmarks.entry_info:
        query: Camera
      register: v1_camera_info

    - name: Read field definitions
      ansible.builtin.uri:
        url: '{{ api_url }}/api/v1/fields'
        headers:
          Authorization: 'Bearer {{ api_token }}'
        return_content: true
      register: field_body

    - name: V1 import merges groups and keeps secrets masked
      ansible.builtin.assert:
        that:
          - v1_first_changed | bool
          - v1_sync is not changed
          - v1_mixer | length == 1
          - "'group:Audio' in v1_mixer_tags"
          - "'group:Video' in v1_mixer_tags"
          - v1_mixer[0].iconRef == 'lucide:sliders'
          - v1_mixer[0].description == 'Lawo desk'
          - v1_mixer[0].sort == 2
          - v1_mixer[0].host == 'mixer.example'
          - (v1_mixer[0].fields | selectattr('key', 'equalto', 'user1') | map(attribute='value') | first) == 'admin'
          - (v1_mixer[0].fields | selectattr('key', 'equalto', 'user2') | map(attribute='masked') | first) | bool
          - v1_camera | length == 1
          - v1_camera[0].iconRef is none
          - v1_camera[0].faviconUrl == 'https://cdn.example/fav.ico'
          - v1_camera[0].host == '10.1.1.9'
          - v1_camera[0].sort == 4
          - v1_camera[0].description == ''
          - (field_body.json.fields | selectattr('key', 'equalto', 'user2') | map(attribute='type') | first) == 'secret'
          - (field_body.json.fields | selectattr('key', 'equalto', 'user2') | map(attribute='showAsColumnDefault') | first) | bool == false
          - (field_body.json.fields | selectattr('key', 'equalto', 'user1') | map(attribute='showAsColumnDefault') | first) | bool
          - (field_body.json.fields | selectattr('key', 'equalto', 'user3') | map(attribute='label') | first) == 'user3'
          - (v1_mixer[0].fields | selectattr('key', 'equalto', 'user3') | map(attribute='value') | first) == 'ignored'
      vars:
        v1_mixer: "{{ v1_mixer_info.entries | selectattr('scope', 'equalto', 'v1-import') | list }}"
        v1_mixer_tags: "{{ v1_mixer[0].tags | map(attribute='label') | list }}"
        v1_camera: "{{ v1_camera_info.entries | selectattr('scope', 'equalto', 'v1-import') | selectattr('externalKey', 'equalto', '8') | list }}"

    - name: Read branding after the default import
      ansible.builtin.uri: &read_branding
        url: '{{ api_url }}/api/v1/settings'
        headers:
          Authorization: 'Bearer {{ api_token }}'
        return_content: true
      register: branding_default

    - name: Preview a branding change without writing
      leeo86.bookmarks.site_branding:
        api_url: '{{ api_url }}'
        api_token: '{{ api_token }}'
        validate_certs: '{{ validate_certs }}'
        site_title: Preview only
        site_claim: Preview only
      check_mode: true
      register: branding_preview

    - name: Read branding after the preview
      ansible.builtin.uri: *read_branding
      register: branding_after_preview

    - name: Default imports and previews preserve V2 branding
      ansible.builtin.assert:
        that:
          - branding_default.json.siteTitle == 'V2 title'
          - branding_default.json.siteClaim == 'V2 claim'
          - branding_preview is changed
          - branding_after_preview.json == branding_default.json

    - name: Import only the V1 title
      ansible.builtin.include_role:
        name: leeo86.bookmarks.v1_import
      vars:
        v1_import_secret_fields: [user2]
        v1_import_site_title: true

    - name: Read branding after importing only the title
      ansible.builtin.uri: *read_branding
      register: branding_title

    - name: Only the selected title changes
      ansible.builtin.assert:
        that:
          - v1_branding is changed
          - v1_sync is not changed
          - branding_title.json.siteTitle == 'V1 fixture title'
          - branding_title.json.siteClaim == 'V2 claim'
          - branding_title.json.accentColour == branding_default.json.accentColour
          - branding_title.json.hasLogo == branding_default.json.hasLogo

    - name: Import only the V1 claim
      ansible.builtin.include_role:
        name: leeo86.bookmarks.v1_import
      vars:
        v1_import_secret_fields: [user2]
        v1_import_site_claim: true

    - name: Read branding after importing only the claim
      ansible.builtin.uri: *read_branding
      register: branding_claim

    - name: Only the selected claim changes
      ansible.builtin.assert:
        that:
          - v1_branding is changed
          - v1_sync is not changed
          - branding_claim.json.siteTitle == 'V1 fixture title'
          - branding_claim.json.siteClaim == 'Lab'

    - name: Repeat both branding options
      ansible.builtin.include_role:
        name: leeo86.bookmarks.v1_import
      vars:
        v1_import_secret_fields: [user2]
        v1_import_site_title: true
        v1_import_site_claim: true

    - name: Repeated branding imports are unchanged
      ansible.builtin.assert:
        that:
          - v1_branding is not changed
          - v1_sync is not changed

    - name: Clear a claim explicitly
      leeo86.bookmarks.site_branding:
        api_url: '{{ api_url }}'
        api_token: '{{ api_token }}'
        validate_certs: '{{ validate_certs }}'
        site_claim: ''

    - name: Read branding after clearing the claim
      ansible.builtin.uri: *read_branding
      register: branding_empty

    - name: An explicitly empty claim clears only the claim
      ansible.builtin.assert:
        that:
          - branding_empty.json.siteClaim == ''
          - branding_empty.json.siteTitle == 'V1 fixture title'

    - name: Import missing V1 branding with both options enabled
      ansible.builtin.include_role:
        name: leeo86.bookmarks.v1_import
      vars:
        v1_url: '{{ v1_fixture_url }}/missing-branding'
        v1_import_site_title: true
        v1_import_site_claim: true
        v1_scope: missing-branding

    - name: Read branding after importing missing values
      ansible.builtin.uri: *read_branding
      register: branding_missing

    - name: Missing V1 values preserve all V2 settings
      ansible.builtin.assert:
        that:
          - v1_branding is skipped
          - branding_missing.json == branding_empty.json

    - name: Reimport a hidden user column as tags
      ansible.builtin.include_role:
        name: leeo86.bookmarks.v1_import
      vars:
        v1_import_secret_fields:
          - user2
        v1_import_tag_fields:
          user3: category
        v1_scope: v1-import

    - name: The new mapping changes existing imported entries
      ansible.builtin.assert:
        that:
          - v1_sync is changed

    - name: Reimport the tag mapping again
      ansible.builtin.include_role:
        name: leeo86.bookmarks.v1_import
      vars:
        v1_import_secret_fields:
          - user2
        v1_import_tag_fields:
          user3: category
        v1_scope: v1-import

    - name: Query the imported tag
      leeo86.bookmarks.entry_info:
        query: category:ignored
      register: v1_tag_info

    - name: Tag mapping is idempotent and replaces the previous managed field value
      ansible.builtin.assert:
        that:
          - v1_sync is not changed
          - v1_tag_info.entries | length == 1
          - (v1_tag_info.entries[0].fields | selectattr('key', 'equalto', 'user3') | list | length) == 0
          - (v1_tag_info.entries[0].fields | selectattr('key', 'equalto', 'user2') | map(attribute='masked') | first) | bool

- name: Exercise v2.2 automation features
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/leeo86.bookmarks.bookmarks:
      api_url: '{{ api_url }}'
      api_token: '{{ api_token }}'
      validate_certs: '{{ validate_certs }}'
  tasks:
    - name: Configure every setting and both branding files
      leeo86.bookmarks.settings: &id001
        site_title: Automation integration
        site_claim: Configured by Ansible
        accent_preset: custom
        accent_colour: '#AbCdEf'
        favicon_colour: '#AbCdEf'
        neutral_palette: stone
        default_colour_mode: dark
        background: tint
        all_tab_public: true
        shared_tabs_public_by_default: true
        client_checks_anonymous: true
        favicon_tls_verify: true
        favicon_refresh_days: 2
        audit_retention_days: 0
        default_scope_edit_mode: free
        logo_src: '{{ playbook_dir }}/images/mixer.svg'
        tab_icon_src: '{{ playbook_dir }}/images/tab.png'
      register: settings_first
    - name: Repeat every setting and image without changes
      leeo86.bookmarks.settings: *id001
      register: settings_second
    - name: Settings are idempotent and expose a diff
      ansible.builtin.assert:
        that:
          - settings_first.changed
          - not settings_second.changed
          - settings_first.diff.before != settings_first.diff.after
    - name: Read settings before_check
      ansible.builtin.uri:
        url: '{{ api_url }}/api/v1/settings'
        headers:
          Authorization: Bearer {{ api_token }}
        validate_certs: '{{ validate_certs }}'
        return_content: true
      register: before_check
      no_log: true
    - name: Preview changed settings and removal of custom images
      leeo86.bookmarks.settings:
        site_title: Check mode title
        all_tab_public: false
        logo_src: ''
        tab_icon_src: ''
      check_mode: true
      register: settings_check
    - name: Read settings after_check
      ansible.builtin.uri:
        url: '{{ api_url }}/api/v1/settings'
        headers:
          Authorization: Bearer {{ api_token }}
        validate_certs: '{{ validate_certs }}'
        return_content: true
      register: after_check
      no_log: true
    - name: Check mode changes no settings or images
      ansible.builtin.assert:
        that:
          - settings_check.changed
          - before_check.json == after_check.json
          - settings_check.diff.before != settings_check.diff.after
    - name: Compare colours case-insensitively
      leeo86.bookmarks.settings:
        accent_colour: '#abcdef'
        favicon_colour: '#abcdef'
      register: colours
    - name: Colour case produces no change
      ansible.builtin.assert:
        that:
          - not colours.changed
    - name: Install icon from a file
      leeo86.bookmarks.icon:
        name: integration-mixer
        src: '{{ playbook_dir }}/images/mixer.svg'
      register: icon_first
    - name: Repeat sanitised SVG from a file
      leeo86.bookmarks.icon:
        name: integration-mixer
        src: '{{ playbook_dir }}/images/mixer.svg'
      register: icon_second
    - name: Icon file is idempotent
      ansible.builtin.assert:
        that:
          - icon_first.changed
          - not icon_second.changed
          - icon_first.id == icon_second.id
          - icon_first.ref == icon_second.ref
          - icon_first.diff.before != icon_first.diff.after
    - name: Reference icon names from entry and link
      leeo86.bookmarks.entry: &id002
        scope: automation-integration
        external_key: mixer
        name: Automation mixer
        icon: upload-name:integration-mixer
        tags:
          - tag: production:integration
            label: Integration production
        links: &id003
          - label: UI
            url_template: https://mixer.invalid
            primary: true
            icon: upload-name:integration-mixer
      register: entry_first
    - name: Repeat icon-name entry and link
      leeo86.bookmarks.entry: *id002
      register: entry_second
    - name: Icon-name references are idempotent
      ansible.builtin.assert:
        that:
          - entry_first.changed
          - not entry_second.changed
    - name: Preview icon replacement without modifying it
      leeo86.bookmarks.icon:
        name: integration-mixer
        content: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgZmlsbD0iYmx1ZSIgb25sb2FkPSJhbGVydCgxKSIvPjwvc3ZnPg==
      check_mode: true
      register: icon_check
    - name: Verify original icon still matches
      leeo86.bookmarks.icon:
        name: integration-mixer
        src: '{{ playbook_dir }}/images/mixer.svg'
      register: icon_original
    - name: Icon preview writes nothing
      ansible.builtin.assert:
        that:
          - icon_check.changed
          - not icon_original.changed
    - name: Replace icon bytes from Base64 in place
      leeo86.bookmarks.icon:
        name: integration-mixer
        content: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgZmlsbD0iYmx1ZSIgb25sb2FkPSJhbGVydCgxKSIvPjwvc3ZnPg==
        content_type: image/svg+xml
      register: icon_replaced
    - name: Repeat icon replacement
      leeo86.bookmarks.icon:
        name: integration-mixer
        content: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgZmlsbD0iYmx1ZSIgb25sb2FkPSJhbGVydCgxKSIvPjwvc3ZnPg==
      register: icon_repeated
    - name: Replacement preserves identity and is idempotent
      ansible.builtin.assert:
        that:
          - icon_replaced.changed
          - not icon_repeated.changed
          - icon_replaced.id == icon_first.id
          - icon_replaced.ref == icon_first.ref
    - name: Synchronise tags with labels and icon-name aliases
      leeo86.bookmarks.entries_sync:
        scope: automation-integration
        entries: &id004
          - external_key: mixer
            name: Automation mixer
            icon: upload-name:integration-mixer
            tags:
              - tag: production:integration
                label: Production display label
            links: *id003
          - external_key: second
            name: Automation second
            tags:
              - production:integration
      register: sync_first
    - name: Repeat labelled bulk entries
      leeo86.bookmarks.entries_sync:
        scope: automation-integration
        entries: *id004
      register: sync_second
    - name: Bulk labels and aliases are idempotent
      ansible.builtin.assert:
        that:
          - sync_first.changed
          - not sync_second.changed
    - name: Preview a changed bulk tag label
      leeo86.bookmarks.entries_sync:
        scope: automation-integration
        entries:
          - external_key: mixer
            name: Automation mixer
            tags:
              - tag: production:integration
                label: Preview label
      check_mode: true
      register: sync_check
    - name: Verify bulk check mode preserved labels
      leeo86.bookmarks.entries_sync:
        scope: automation-integration
        entries: *id004
      register: sync_preserved
    - name: Bulk label check mode writes nothing
      ansible.builtin.assert:
        that:
          - sync_check.changed
          - not sync_preserved.changed
          - sync_check.diff.before != sync_check.diff.after
    - name: Create a manual tab outside sync ownership
      leeo86.bookmarks.filter:
        name: Integration manual
        query: ''
        is_public: false
        view_mode: list
    - name: Create tabs owned by another scope
      leeo86.bookmarks.filters_sync:
        scope: integration-other
        purge: true
        filters: &id005
          - external_key: production
            name: Integration production
            query: production:integration
            icon: camera
            group_by: production
            sort: 8
            view_mode: tiles
            columns:
              - name
              - host
            is_public: true
    - name: Synchronise every shared tab field
      leeo86.bookmarks.filters_sync:
        scope: automation-integration
        purge: true
        filters: *id005
      register: tabs_first
    - name: Repeat shared tabs
      leeo86.bookmarks.filters_sync:
        scope: automation-integration
        purge: true
        filters: *id005
      register: tabs_second
    - name: Tabs are idempotent with a diff
      ansible.builtin.assert:
        that:
          - tabs_first.changed
          - not tabs_second.changed
          - tabs_first.diff.before != tabs_first.diff.after
    - name: Preview scoped tab deletion
      leeo86.bookmarks.filters_sync:
        scope: automation-integration
        purge: true
        filters: []
      check_mode: true
      register: tabs_check
    - name: Verify scoped tab preview preserved tabs
      leeo86.bookmarks.filters_sync:
        scope: automation-integration
        purge: true
        filters: *id005
      register: tabs_preserved
    - name: Tabs check mode writes nothing
      ansible.builtin.assert:
        that:
          - tabs_check.changed
          - not tabs_preserved.changed
          - tabs_check.deleted == ["production"]
    - name: Remove only this scope tabs
      leeo86.bookmarks.filters_sync:
        scope: automation-integration
        purge: true
        filters: []
      register: tabs_deleted
    - name: Repeat scope purge
      leeo86.bookmarks.filters_sync:
        scope: automation-integration
        purge: true
        filters: []
      register: tabs_absent
    - name: Verify other-scope tabs remain
      leeo86.bookmarks.filters_sync:
        scope: integration-other
        purge: true
        filters: *id005
      register: other_preserved
    - name: Verify manual tab remains
      leeo86.bookmarks.filter:
        name: Integration manual
        query: ''
        is_public: false
        view_mode: list
      register: manual_preserved
    - name: Purge leaves other scopes and manual tabs intact
      ansible.builtin.assert:
        that:
          - tabs_deleted.changed
          - not tabs_absent.changed
          - not other_preserved.changed
          - not manual_preserved.changed
    - name: Preview icon deletion
      leeo86.bookmarks.icon:
        name: integration-mixer
        state: absent
      check_mode: true
      register: icon_delete_check
    - name: Verify icon deletion preview preserved bytes
      leeo86.bookmarks.icon:
        name: integration-mixer
        content: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgZmlsbD0iYmx1ZSIgb25sb2FkPSJhbGVydCgxKSIvPjwvc3ZnPg==
      register: icon_delete_preserved
    - name: Icon absence check mode writes nothing
      ansible.builtin.assert:
        that:
          - icon_delete_check.changed
          - not icon_delete_preserved.changed
    - name: Delete the test icon
      leeo86.bookmarks.icon:
        name: integration-mixer
        state: absent
      register: icon_deleted
    - name: Repeat test icon deletion
      leeo86.bookmarks.icon:
        name: integration-mixer
        state: absent
      register: icon_absent
    - name: Icon deletion is idempotent
      ansible.builtin.assert:
        that:
          - icon_deleted.changed
          - not icon_absent.changed
    - name: Read entries using session credentials
      leeo86.bookmarks.entry_info:
        api_token: ''
        username: admin
        password: '{{ lookup("env", "BOOKMARKS_TEST_PASSWORD") | default("admin-pass-1", true) }}'
      register: session_info
      no_log: true
    - name: Read entries using environment session credentials
      leeo86.bookmarks.entry_info:
        api_token: ''
      environment:
        BOOKMARKS_USERNAME: admin
        BOOKMARKS_PASSWORD: '{{ lookup("env", "BOOKMARKS_TEST_PASSWORD") | default("admin-pass-1", true) }}'
      register: session_env_info
      no_log: true
    - name: Session authentication is read-only
      ansible.builtin.assert:
        that:
          - not session_info.changed
          - not session_env_info.changed
