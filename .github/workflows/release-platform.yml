name: Build and verify native release image

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
    outputs:
      digest:
        description: Digest of the runtime-verified native image
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and test ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ inputs.platform }}
          outputs: type=image,name=ghcr.io/leeo86/bookmark-page,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ inputs.tag }}
      - name: Verify exact image on the native runner without networking
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="ghcr.io/leeo86/bookmark-page@$IMAGE_DIGEST"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "$PLATFORM"
          bash docker/test-offline.sh "$image"
          bash docker/test-automation.sh "$image"
